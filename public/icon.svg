<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded background badge with deep obsidian tech glow -->
  <rect width="64" height="64" rx="16" fill="#090d1a"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="url(#grad)" stroke-width="2"/>
  
  <!-- Graduation Cap (Mortarboard) -->
  <polygon points="32,9 53,19 32,29 11,19" fill="url(#capGrad)"/>
  <path d="M20,24 L20,31 C20,37 44,37 44,31 L44,24" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Tassel -->
  <path d="M48,21 L50,33 C50,35 48,36 46,36" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <circle cx="46" cy="36" r="2" fill="#f59e0b"/>

  <!-- Student Face -->
  <circle cx="32" cy="32" r="6.5" fill="#fed7aa" stroke="#090d1a" stroke-width="1.5"/>

  <!-- Student Shoulders / Body -->
  <path d="M18,54 C18,44 24,42 32,42 C40,42 46,44 46,54 Z" fill="url(#grad)"/>

  <!-- Studying Laptop Screen & Base -->
  <path d="M14,56 L50,56 L47,51 L17,51 Z" fill="#06b6d4" opacity="0.9"/>
  <rect x="22" y="44" width="20" height="9" rx="2" fill="#0b1120" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="25" y1="47" x2="35" y2="47" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="25" y1="50" x2="31" y2="50" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Knowledge Sparkle -->
  <polygon points="53,11 54.5,14 57.5,15.5 54.5,17 53,20 51.5,17 48.5,15.5 51.5,14" fill="#fbbf24"/>
</svg>